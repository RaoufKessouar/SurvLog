name: Surveillance logements Fac-Habitat

on:
  schedule:
    - cron: "13 */4 * * *"   # secours : 1 tentative toutes les 4h si cron-job.org tombe en panne
  workflow_dispatch:          # déclenché toutes les 30 min par cron-job.org

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier les disponibilités
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Alerte par email (création d'une issue GitHub)
        if: ${{ hashFiles('alert.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🏠 Disponibilité détectée — $(date -u +'%d/%m/%Y %H:%M')" \
            --body-file alert.md \
            --assignee "${{ github.repository_owner }}"

      - name: Sauvegarder l'état
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json historique.csv
          [ -f journal_checks.csv ] && git add journal_checks.csv
          if ! git diff --cached --quiet; then
            git commit -m "màj état $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git push && break
              echo "push refusé, resynchronisation (essai $i)..."
              git pull --rebase origin main || { git rebase --abort; exit 1; }
            done
          fi
